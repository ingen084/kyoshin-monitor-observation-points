name: Observation Points Diff

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'intensity-points.json'

permissions:
  contents: read
  pull-requests: write

# 追加でプッシュされた場合は前の実行を打ち切り、最新の内容でコメントを更新する
concurrency:
  group: observation-points-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diff:
    name: Post diff comment
    runs-on: ubuntu-latest

    steps:
      # fork からの PR でもコメントを投稿できるよう pull_request_target を使用している
      # そのため PR 側のコードは一切実行せず、ベースブランチのスクリプトのみを使用する
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch pull request head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

      # 変更前後の intensity-points.json を取り出す (PR 側からはデータファイルのみを読み取る)
      - name: Extract intensity-points.json
        id: extract
        run: |
          set -euo pipefail
          merge_base="$(git merge-base HEAD refs/remotes/pr/head)"
          echo "merge_base=${merge_base}" >> "$GITHUB_OUTPUT"
          extract() {
            if git cat-file -e "$1:intensity-points.json" 2>/dev/null; then
              git show "$1:intensity-points.json" > "$2"
            else
              printf '[]' > "$2"
            fi
          }
          extract "${merge_base}" "${RUNNER_TEMP}/base.json"
          extract "refs/remotes/pr/head" "${RUNNER_TEMP}/head.json"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build diff comment
        id: build
        env:
          BEFORE_REF: ${{ steps.extract.outputs.merge_base }}
          AFTER_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          dotnet run --project ObservationPointPacker/ObservationPointPacker.csproj --configuration Release -- \
            diff "${RUNNER_TEMP}/base.json" "${RUNNER_TEMP}/head.json" "${RUNNER_TEMP}/comment.md" \
            "${BEFORE_REF}" "${AFTER_REF}"
          cat "${RUNNER_TEMP}/comment.md" >> "$GITHUB_STEP_SUMMARY"

      # マーカー付きの既存コメントがあれば更新し、なければ新規作成する
      - name: Create or update comment
        uses: actions/github-script@v7
        env:
          COMMENT_PATH: ${{ runner.temp }}/comment.md
          HAS_CHANGES: ${{ steps.build.outputs.has_changes }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- observation-points-diff -->';
            const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`コメントを更新しました: ${existing.html_url}`);
              return;
            }
            if (process.env.HAS_CHANGES !== 'true') {
              core.info('内容の差分がないためコメントを作成しませんでした。');
              return;
            }
            const { data } = await github.rest.issues.createComment({ owner, repo, issue_number, body });
            core.info(`コメントを作成しました: ${data.html_url}`);
